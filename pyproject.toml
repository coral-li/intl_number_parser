[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intl-number-parser"
version = "0.1.0"
description = "International number parser with locale autodetection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "unicodedata2>=15.0.0",
]

[project.optional-dependencies]
dev = [
    # Core development tools
    "ruff>=0.12.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",

    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",  # Parallel test execution
    "coverage[toml]>=7.0.0",

    # Type stubs
    "types-requests",
    "pandas-stubs",

    # Documentation
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",

    # Build and packaging
    "build>=0.10.0",
    "twine>=4.0.0",
    "wheel>=0.40.0",

    # Security scanning
    "bandit>=1.7.0",
    "safety>=2.0.0",

    # Performance profiling
    "memray>=1.7.0",
    "py-spy>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/intl-number-parser"
Repository = "https://github.com/yourusername/intl-number-parser"
Documentation = "https://intl-number-parser.readthedocs.io/"
Issues = "https://github.com/yourusername/intl-number-parser/issues"

# ============================================================================
# Ruff Configuration (replaces black, isort, flake8, and more)
# ============================================================================

[tool.ruff]
line-length = 88
target-version = "py38"  # Minimum Python version support
src = ["intl_number_parser"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.format]
# Use double quotes for strings (Black-compatible)
quote-style = "double"
# Use spaces for indentation (Black-compatible)
indent-style = "space"
# Respect magic trailing commas (Black-compatible)
skip-magic-trailing-comma = false
# Auto-detect line endings (Black-compatible)
line-ending = "auto"
# Format docstrings (Black-compatible)
docstring-code-format = true
# Format code in docstrings using the same settings
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    # Core Python rules
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "FIX",  # flake8-fixme
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # Pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "PERF", # Perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules
]

# Ignore specific rules that might conflict with project needs
ignore = [
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D212",    # Multi-line docstring summary should start at the first line
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D415",    # First line should end with a period, question mark, or exclamation point

    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicitly concatenated string literals (conflicts with formatter)
    "Q000",    # Single quotes found but double quotes preferred (handled by formatter)
    "Q001",    # Single quote docstring found but double quotes preferred (handled by formatter)
    "Q002",    # Docstring contains escape sequence (handled by formatter)
    "Q003",    # Change outer quotes to avoid escaping inner quotes (handled by formatter)

    "PD901",   # pandas-vet: df is a bad variable name (too restrictive for this project)
    "RUF001",  # String contains ambiguous Unicode character (intentional)
]

# Allow autofix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
# Tests can use more relaxed rules
"tests/**/*" = [
    "D100",    # Missing docstring in public module
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "S101",    # Use of assert detected
    "PLR2004", # Magic value used in comparison
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "RUF001",  # String contains ambiguous Unicode character (intentional in tests)
    "RUF002",  # Docstring contains ambiguous Unicode character (intentional in tests)
    "RUF003",  # Comment contains ambiguous Unicode character (intentional in tests)
]
# __init__.py files can have unused imports
"__init__.py" = [
    "F401",    # imported but unused
    "F403",    # star imports
    "D104",    # Missing docstring in public package
]
# Unicode module contains intentional Unicode characters
"intl_number_parser/unicode.py" = [
    "RUF001",  # String contains ambiguous Unicode character (intentional)
    "RUF002",  # Docstring contains ambiguous Unicode character (intentional)
]

# Specific rule configurations
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["intl_number_parser"]
force-single-line = false
force-sort-within-sections = false
single-line-exclusions = ["typing"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# ============================================================================
# MyPy Configuration
# ============================================================================

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov=intl_number_parser",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["intl_number_parser"]
branch = true
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
